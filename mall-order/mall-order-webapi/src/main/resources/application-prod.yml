# ##################################################################### #
#                            【生产】环境配置                              #
# ##################################################################### #
#  当前文件是Profile配置，需要主配置文件中通过spring.profiles.active激活后生效   #
# ##################################################################### #

# 部署到阿里云后，将此地址替换为服务器内网IP或127.0.0.1(单机部署)
my:
  server:
    addr: ${ALIYUN_SERVER_IP:127.0.0.1}

# 优雅关闭：收到 SIGTERM 后等待在途请求处理完毕再退出（配合 systemd TimeoutStopSec=30）
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${my.server.addr}:3306/cs_mall_oms?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: mall-order
  jackson:
    default-property-inclusion: always
  cloud:
    nacos:
      discovery:
        server-addr: ${my.server.addr}:8848
        # #13 Nacos 认证：客户端账号密码（compose 注入 NACOS_USERNAME/PASSWORD）
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
    # TODO #5：Sentinel 规则统一 Nacos 管理（flow + degrade）。
    # ⚠️ 机制认知：配了 Nacos datasource 后权威源=Nacos（整体替换非叠加）——
    #   Nacos 配置为空会擦除本地代码规则，故 dataId 必须在 Nacos 持久存在
    #   （规则 JSON 事实来源：仓库 deploy/docker/sentinel/，部署清单含建规则步骤）。
    #   transport.dashboard 由 compose 环境变量注入，此处冗余配置以保持各环境一致。
    sentinel:
      # eager=true: transport(CommandCenter)启动时即初始化并向 Dashboard 注册，
      # 否则懒加载——无流量时 Dashboard 查不到规则/监控（#5 部署实测发现）
      eager: true
      transport:
        port: 8872
        dashboard: ${my.server.addr}:8858
      datasource:
        flow:
          nacos:
            server-addr: ${my.server.addr}:8848
            # #13 Nacos 认证：Sentinel 规则 datasource 账号
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            data-id: mall-order-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${my.server.addr}:8848
            # #13 Nacos 认证：Sentinel 规则 datasource 账号
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            data-id: mall-order-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
  data:
    redis:
      host: ${my.server.addr}
      port: 6379
      password: ${REDIS_PASSWORD:}
  # ⚠️ #70（2026-09-12 实测）：ack 模式 / 限次重试 **不能写在这里** —— 写了也不生效！
  #   原因：mall-order 在 OrderQueueConfig 里**自己定义了** `rabbitListenerContainerFactory` bean，
  #   `@RabbitListener` 用的是它；而 `spring.rabbitmq.listener.simple.*` 只作用于
  #   "Spring Boot **自动配置**的那个 factory" ⇒ 这里是**影子配置**（配置在 jar 里、却没有任何代码读它）。
  #   实测：这里写了 `acknowledge-mode: manual`，运行日志仍是 `acknowledgeMode=AUTO`
  #   ⇒ 容器自动 ack 与代码手动 ack **双确认** ⇒ `channel error 406 PRECONDITION_FAILED unknown delivery tag`。
  #   ✅ 权威设置在**代码**：`OrderQueueConfig#rabbitListenerContainerFactory`
  #      （setAcknowledgeMode(MANUAL) + setDefaultRequeueRejected(false) + RetryInterceptorBuilder 3 次后进 DLX）。
  #   （连接参数仍由 compose 的 SPRING_RABBITMQ_* 注入 —— 环境变量优先级确实高于 yml。）

dubbo:
  application:
    name: mall-order-dubbo
  protocol:
    port: -1
    name: dubbo
  registry:
    address: nacos://${my.server.addr}:8848
    # #13 Nacos 认证：Dubbo registry 客户端账号
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false
    timeout: 5000

seata:
  tx-service-group: csmall_group
  service:
    vgroup-mapping:
      csmall_group: default
    grouplist:
      default: ${my.server.addr}:8091
  client:
    undo:
      log-serialization: jackson

knife4j:
  production: true

logging:
  level:
    com.cooxiao.mall: info

# ==================== 支付宝配置（生产环境） ====================
alipay:
  app-id: ${ALIPAY_APP_ID:}
  gateway: https://openapi.alipay.com/gateway.do
  merchant-private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: ${ALIPAY_RETURN_URL:}
  sign-type: RSA2
  charset: UTF-8
  format: json
