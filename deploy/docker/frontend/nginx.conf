# CoolShark 商城 Nginx 配置
# 用途：前端 SPA + API 反向代理 + 静态图片服务 + SSE 流式
# 部署路径：/etc/nginx/conf.d/csmall.conf
# 服务器源文件：/data/csmall/frontend/nginx.conf（Dockerfile.frontend 里 COPY 进镜像）
#
# ============================================================================
# 2026-09-10 故障修复：上游动态解析
# ----------------------------------------------------------------------------
# 旧写法 `proxy_pass http://mall-gateway:10087` 里的主机名，nginx 只在【加载配置
# 那一刻】解析一次并永久缓存，效果等价于写死 IP。网关容器一旦重建换了 IP，nginx
# 仍把请求打到旧 IP → 全站 API 502。
#   本次实际故障：网关重建后 IP 由 172.18.0.9 变为 172.18.0.7，而 172.18.0.9 被
#   后来重建的 mall-ai 占用 → nginx 把 /user /front /ai 全打到 mall-ai:10087，
#   连接被拒（connect() failed 111）→ 502。
# 现改为 resolver + upstream resolve：每 10s 重新解析，容器重建后自动跟随。
#   A/B 实测（隔离网络，2026-09-10）：容器重建后「动态解析 = 200 OK」「静态解析 = 502」。
# ⚠️ 127.0.0.11 是 Docker 内嵌 DNS，仅在默认 bridge 网络下有效；
#    若改用 host 网络或自定义 dns，这里要跟着改。
# ⚠️ `resolve` 是 nginx ≥ 1.27.3 才在 OSS 版开放的能力（当前容器 1.31.5）；
#    若把基础镜像退回旧版本，nginx 会因语法错误启动失败——部署前务必 nginx -t。
# ============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

upstream mall_gateway {
    zone mall_gateway 64k;                 # resolve 需配合 zone（共享内存区）
    server mall-gateway:10087 resolve;     # 动态解析：TTL 到期自动重查，不再依赖重启 nginx
}

server {
    listen 80;
    server_name localhost;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SSE 流式路径：关闭缓冲（必须在通用 /ai/ 之前精确匹配）
    location = /ai/chat/stream {
        proxy_pass http://mall_gateway;
        proxy_buffering off;
        proxy_cache off;
        # 2026-09-10 合并：思考模式下 reasoning 分片被后端刻意忽略（只转发 content），
        # 模型"闷头思考"期间 nginx 读不到任何字节 → 默认 60s 会被掐断（504）→ 放宽到 180s
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gateway 代理（内部跳转用）
    location @gateway {
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard：Accept JSON → Gateway API，否则 → SPA index.html
    location = /admin/dashboard {
        error_page 418 = @gateway;
        if ($http_accept ~* "application/json") {
            return 418;
        }
        rewrite ^ /index.html last;
    }

    # Admin 后台管理其余 SPA 页面路径
    location ~ ^/admin/ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 短路径保护（2026-09-10 合并）：GET /seckill/:id 是浏览器页面访问（刷新时走 SPA），
    # 但通用 API location 会把它当受保护接口转发 → 页面刷新返回 {"state":401,...} JSON 而非页面。
    # POST（秒杀下单 /seckill/{randCode}）等非 GET 请求仍直通 Gateway。
    # ⚠️ 必须排在通用 API location 之前：nginx 正则 location 先匹配者胜。
    # ⚠️ 本正则只吃 /seckill、/seckill/、/seckill/纯数字 → 不误伤 /seckill/spu/list、/seckill/sku/list/{id}
    location ~ ^/seckill/?\d*$ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ 前缀路由 → 剥离前缀后转发 Gateway
    location ~ ^/api/(admin|sso|oms|front|seckill|ai|search|user|ums|pms|resource|ams)/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 所有 API 路径统一代理到 Gateway
    location ~ ^/(admin|sso|oms|front|seckill|ai|search|user|ums|pms|resource|ams)/ {
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 文件上传（需要更大的请求体）
    location /upload/ {
        proxy_pass http://mall_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    # 静态图片（由 Nginx 直接从磁盘提供，不经过 Java 服务栈）
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        root /data/csmall-upload;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA（Vue History 模式）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
