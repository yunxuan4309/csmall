# CoolShark Redis 哨兵 2（跨机集群 · 仅新机 csmall-node2 使用）
# 部署：复制到新机 /data/csmall/redis/sentinel-2.conf，并把 <REDIS_PASSWORD> 替换为 .env 中的实际强密码
# ⚠️ 哨兵会 REWRITE 本文件 → 挂载不要加 :ro；与 sentinel-1.conf 只有 port 不同（必须独立文件）

port 26380
bind 0.0.0.0
protected-mode no
dir /data

sentinel monitor mymaster 172.29.193.239 6379 2
sentinel auth-pass mymaster <REDIS_PASSWORD>

sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1
