# CoolShark Redis 主节点配置(R1~R4 加固)
# 状态: 2026-09 第一批加固评审稿 —— 部署时由 ecs-user 复制到服务器 /data/csmall/redis/redis-master.conf
#       并替换 <REDIS_PASSWORD> 为 .env 中的实际强密码(与 REDIS_PASSWORD 一致)
# ⚠️ 挂载到容器不加 :ro —— Redis 运行时会自动 REWRITE 本文件(记录角色等),只读会导致故障切换失败
# ⚠️ 本文件含密码占位符,不入库; 实际密码只在服务器 /data/csmall/.env 与 /data/csmall/redis/*.conf

bind 0.0.0.0
port 6379
requirepass <REDIS_PASSWORD>
masterauth <REDIS_PASSWORD>

# 2026-09-09 窗口A（阶段2a）：跨机主从必需
# 本节点被降级为从库时，向新主上报的地址必须是宿主内网 IP —— 否则上报容器 IP（172.18.x），新机不可达 → 复制断链
replica-announce-ip 172.29.193.239
replica-announce-port 6379

maxmemory 256mb
maxmemory-policy volatile-lru
appendonly yes
appendfsync everysec
dir /data

# 2026-09-09 #14-P2：防主从切换丢数据
# 主库在"无法确认数据已复制到至少 1 个从库（或从库延迟 > max-lag）"时拒绝写
# 背景：故障转移演练实测到 10.9s 脑裂窗口（旧主库重启后自认为主，直到哨兵降级）
# 代价：只有一个从库 → 从库不可用时主库会拒写（宁可报错，不静默丢数据）
# ⚠️ 单文件 bind mount 下 CONFIG REWRITE 会失败（Resource busy）→ 必须手工维护本文件
min-replicas-to-write 1
min-replicas-max-lag 10
