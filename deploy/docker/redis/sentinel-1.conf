# CoolShark Redis 哨兵 1（跨机集群 · 仅新机 csmall-node2 使用）
# 部署：复制到新机 /data/csmall/redis/sentinel-1.conf，并把 <REDIS_PASSWORD> 替换为 .env 中的实际强密码
# ⚠️ 哨兵会 REWRITE 本文件（记录已知从节点/纪元/配置版本）→ 挂载不要加 :ro；仓库副本仅作模板
# ⚠️ 三个哨兵必须各自独立配置文件（共用一份会互相覆盖）

port 26379
bind 0.0.0.0
protected-mode no
dir /data

# 监视老机主库：quorum=2（3 哨兵中的多数派），地址用宿主内网 IP + 映射端口
sentinel monitor mymaster 172.29.193.239 6379 2
sentinel auth-pass mymaster <REDIS_PASSWORD>

# 5s 无响应判主观下线；15s 故障转移超时（与 Lua 短脚本/任务耗时保持数量级差距）
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 15000
sentinel parallel-syncs mymaster 1
