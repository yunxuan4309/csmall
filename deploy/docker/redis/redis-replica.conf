# CoolShark Redis 从节点配置（跨机集群 · 仅新机 csmall-node2 使用）
# 部署：复制到新机 /data/csmall/redis/redis-replica.conf，并把 <REDIS_PASSWORD> 替换为 .env 中的实际强密码
# ⚠️ 挂载到容器不要加 :ro —— Redis 运行时会 REWRITE 本文件（记录复制状态/主从信息）
# ⚠️ 本文件含密码占位符，不入库真实密码；实际密码只在服务器 /data/csmall/.env 与 /data/csmall/redis/*.conf

bind 0.0.0.0
port 6380

requirepass <REDIS_PASSWORD>
masterauth <REDIS_PASSWORD>

# 老机 Redis 主（经阶段 2a 放行到宿主内网 IP 的映射端口）
replicaof 172.29.193.239 6379
replica-read-only yes

# 跨机关键：向主库上报"宿主内网 IP + 宿主端口"，否则主库/哨兵看到的是容器 IP（不可达）
replica-announce-ip 172.29.193.240
replica-announce-port 6380

appendonly yes
appendfsync everysec

maxmemory 256mb
maxmemory-policy volatile-lru

dir /data
