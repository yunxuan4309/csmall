services:

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: csmall-mysql
    ports:
      # 2026-09-09 窗口A（阶段2a）：127.0.0.1 → 宿主内网 IP，供新机 csmall-node2 跨机访问
      # 绑私网 IP 而非 0.0.0.0 → 公网不可达；安全组未放行 3306 公网
      - "172.29.193.239:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - csmall-net

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: csmall-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      # 2026-09-09 窗口A（阶段2a）：127.0.0.1 → 宿主内网 IP
      # 哨兵监控地址必须稳定（容器 IP 重建即变）→ 用宿主私网 IP + 映射端口
      - "172.29.193.239:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis-master.conf:/usr/local/etc/redis/redis.conf
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - csmall-net

  # ==================== 注册/配置中心 ====================
  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: csmall-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      # R7: 堆 1g→512m（standalone 注册量小，最大单点内存收益 ~480M）
      JVM_XMS: "512m"
      JVM_XMX: "512m"
      JVM_XMN: "256m"
      # #13 认证开启（2026-09-08）：NACOS_AUTH_TOKEN 必须 Base64 ≥32 字节，
      # 值在 .env 同步；开启后无 token 访问返回 403，所有客户端须配账号（见 #13 部署清单）
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
    volumes:
      # ⚠️ 2026-09-08 补：nacos 此前无数据卷 → 重建容器 derby 数据(配置/用户/规则)全丢
      #   （#13 部署实测：重建后 6 条 Sentinel 规则 dataId 丢失，从仓库 JSON 重建）
      #   derby 数据在 /home/nacos/data（含 config/naming/derby），必须挂卷持久化
      - nacos_data:/home/nacos/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - csmall-net

  # ==================== 消息队列 ====================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: csmall-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - csmall-net

  # ==================== 搜索引擎 ====================
  elasticsearch:
    image: elasticsearch:8.6.0
    container_name: csmall-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - /data/csmall/es-plugins/analysis-ik:/usr/share/elasticsearch/plugins/analysis-ik
    mem_limit: 1.5g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - csmall-net

  # ==================== 分布式事务 ====================
  seata:
    image: apache/seata-server:2.1.0
    container_name: csmall-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      JVM_XMX: "512m"
      JVM_XMS: "256m"
      JVM_MaxMetaspaceSize: "128m"
      JVM_MaxDirectMemorySize: "128m"
    mem_limit: 512m
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7091 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - csmall-net

  # ==================== 流量控制 ====================
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: csmall-sentinel
    ports:
      - "8090:8858"
    environment:
      # R7: 显式限制堆，消除默认 ~3.5G 堆上限隐患
      JAVA_OPTS: "-Dserver.port=8858 -Xms128m -Xmx256m"
    mem_limit: 512m
    networks:
      - csmall-net

  # ==================== 链路追踪 ====================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: csmall-skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      JAVA_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1.5g
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - csmall-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: csmall-skywalking-ui
    ports:
      - "8088:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    mem_limit: 512m
    depends_on:
      - skywalking-oap
    networks:
      - csmall-net

  # ==================== 微服务（11 个，从 /data/csmall/jars/ 构建） ====================

  mall-gateway:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-gateway.Dockerfile
    container_name: csmall-gateway
    ports: ["10087:10087"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 768m
    restart: on-failure
    depends_on: { nacos: { condition: service_healthy } }
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-sso:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-sso.Dockerfile
    container_name: csmall-sso
    ports: ["10009:10009"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_DATASOURCE_ADMIN_JDBC_URL: jdbc:mysql://mysql:3306/cs_mall_ams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USER_JDBC_URL: jdbc:mysql://mysql:3306/cs_mall_ums?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_ORDER_JDBC_URL: jdbc:mysql://mysql:3306/cs_mall_oms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 768m
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-product:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-product.Dockerfile
    container_name: csmall-product
    # 20880: Dubbo provider 端口（2026-09-09 窗口A 阶段2b，跨机集群）
    # 绑定宿主私网 IP（纵深防御：公网由安全组挡，绑定地址再挡一层；与 3306/6379 风格一致）
    ports: ["9010:9010", "172.29.193.239:20880:20880"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 2026-09-09 窗口A（阶段2b）：注册到 Nacos 的地址用宿主内网 IP + 映射端口
      # 否则消费者（含新机秒杀副本）拿到容器 IP 172.18.x → 跨机不可达
      DUBBO_IP_TO_REGISTRY: 172.29.193.239
      DUBBO_PORT_TO_REGISTRY: "20880"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cs_mall_pms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      CUSTOM_FILE_UPLOAD_RESOURCE_HOST: http://8.156.77.197/
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 1g
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      seata: { condition: service_healthy }
    restart: on-failure
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-front:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-front.Dockerfile
    container_name: csmall-front
    ports: ["10004:10004"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 1g
    restart: on-failure
    depends_on: { nacos: { condition: service_healthy } }
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-order:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-order.Dockerfile
    container_name: csmall-order
    # 20881(宿主) → 20880(容器)：与 product 的 20880 错开，避免宿主端口冲突（2026-09-09 窗口A 阶段2b）
    # 同样绑定宿主私网 IP（纵深防御）
    ports: ["10005:10005", "172.29.193.239:20881:20880"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 2026-09-09 窗口A（阶段2b）：注册宿主内网 IP + 映射端口（20881），跨机消费者才能连到
      DUBBO_IP_TO_REGISTRY: 172.29.193.239
      DUBBO_PORT_TO_REGISTRY: "20881"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cs_mall_oms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 1g
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      seata: { condition: service_healthy }
    restart: on-failure
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-search:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-search.Dockerfile
    container_name: csmall-search
    ports: ["10008:10008"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # TODO #33 A2：普通搜索返回图片需拼接完整 URL（与 mall-ai/product/resource 对齐）
      CUSTOM_FILE_UPLOAD_RESOURCE_HOST: http://8.156.77.197/
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 768m
    depends_on:
      nacos: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      seata: { condition: service_healthy }
    restart: on-failure
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-seckill:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-seckill.Dockerfile
    container_name: csmall-seckill
    ports: ["10007:10007"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
      SEATA_SERVICE_GROUPLIST_DEFAULT: seata:8091
      ALIYUN_SERVER_IP: nacos
      # #13 Nacos 认证：客户端账号（nacos 用户, 密码在 .env）
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cs_mall_seckill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m -XX:+UseStringDeduplication"
    mem_limit: 1g
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      seata: { condition: service_healthy }
    restart: on-failure
    volumes:
      - /data/csmall/skywalking-agent:/skywalking-agent:ro
    networks: [csmall-net]

  mall-ums:
    build:
      context: ./jars
      dockerfile: ../dockerfiles/mall-ums.Dockerfile
    container_name: csmall-ums
    ports: ["10006:10006"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 2026-09-09 阶段3.5：Redis 客户端改【哨兵模式】——standalone 在故障转移后会连到只读从库报 READONLY
      # 配了 sentinel 后 SPRING_DATA_REDIS_HOST 自动失效；哨兵本身无密码，故不设 SENTINEL_PASSWORD
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: 172.29.193.240:26379,172.29.193.240:26380,172.29.193.240:26381
