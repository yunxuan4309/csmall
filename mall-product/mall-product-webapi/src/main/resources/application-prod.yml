# ##################################################################### #
#                            【生产】环境配置                              #
# ##################################################################### #
#  当前文件是Profile配置，需要主配置文件中通过spring.profiles.active激活后生效   #
# ##################################################################### #

# 部署到阿里云后，将此地址替换为服务器内网IP或127.0.0.1(单机部署)
my:
  server:
    addr: ${ALIYUN_SERVER_IP:127.0.0.1}

# 优雅关闭：收到 SIGTERM 后等待在途请求处理完毕再退出（配合 systemd TimeoutStopSec=30）
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${my.server.addr}:3306/cs_mall_pms?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${my.server.addr}
      port: 6379
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${my.server.addr}:8848
  application:
    name: mall-product

dubbo:
  application:
    # ⚠️ 不能与 spring.application.name(mall-product)撞名：Dubbo 3.x 应用级注册会把 20880 混进
    # mall-product 服务名（历史：gateway 曾因 lb://mall-product 轮询打到 Dubbo 端口，改直连 9010 规避）
    # → 本修复根治撞名（TODO #6，2026-09-08），改名后 gateway 可改回 lb://mall-product
    name: mall-product-dubbo
  protocol:
    port: -1
    name: dubbo
  registry:
    address: nacos://${my.server.addr}:8848
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false

seata:
  tx-service-group: csmall_group
  service:
    vgroup-mapping:
      csmall_group: default
    grouplist:
      default: ${my.server.addr}:8091
  client:
    undo:
      log-serialization: jackson

custom:
  file-upload:
    server-local-path: /data/csmall-upload
    resource-host: ${RESOURCE_HOST:http://8.156.77.197/}

knife4j:
  production: true

logging:
  level:
    com.cooxiao.mall: info
