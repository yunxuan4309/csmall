# ##################################################################### #
#                            【生产】环境配置                              #
# ##################################################################### #
#  当前文件是Profile配置，需要主配置文件中通过spring.profiles.active激活后生效   #
# ##################################################################### #

# 部署到阿里云后，将此地址替换为服务器内网IP或127.0.0.1(单机部署)
my:
  server:
    addr: ${ALIYUN_SERVER_IP:127.0.0.1}

# 优雅关闭：收到 SIGTERM 后等待在途请求处理完毕再退出（配合 systemd TimeoutStopSec=30）
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${my.server.addr}:8848
        # #13 Nacos 认证：客户端账号密码（compose 注入 NACOS_USERNAME/PASSWORD）
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
    # TODO #5：Sentinel 规则统一 Nacos 管理（flow + degrade）。
    # ⚠️ 机制认知：配了 Nacos datasource 后权威源=Nacos（整体替换非叠加）——
    #   Nacos 配置为空会擦除本地代码规则，故 dataId 必须在 Nacos 持久存在
    #   （规则 JSON 事实来源：仓库 deploy/docker/sentinel/，部署清单含建规则步骤）。
    sentinel:
      # eager=true: transport(CommandCenter)启动时即初始化并向 Dashboard 注册，
      # 否则懒加载——无流量时 Dashboard 查不到规则/监控（#5 部署实测发现）
      eager: true
      transport:
        port: 8880
        dashboard: ${my.server.addr}:8858
      # 仅 flow 规则（adminLogin 限流防爆破）。不配 degrade datasource：
      # 登录失败属业务异常，配异常比例熔断会误伤；慢调用熔断也非登录场景刚需。
      datasource:
        flow:
          nacos:
            server-addr: ${my.server.addr}:8848
            # #13 Nacos 认证：Sentinel 规则 datasource 账号
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:}
            data-id: mall-sso-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  jackson:
    default-property-inclusion: non_null
  datasource:
    admin:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_ams?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
    user:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_ums?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
    order:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_oms?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${my.server.addr}
      port: 6379
      password: ${REDIS_PASSWORD:}

knife4j:
  production: true

logging:
  level:
    com.cooxiao.mall: info
