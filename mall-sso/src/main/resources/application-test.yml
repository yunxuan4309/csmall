my:
  server:
    addr: localhost
    #addr: localhost,192.168.137.150

spring:
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${my.server.addr}:8848
    sentinel:
      transport:
        port: 8880
        dashboard: 127.0.0.1:8090
      eager: true
      # TODO #5：本地环境同样从 Nacos 拉 flow 规则（与生产同构；本地 Nacos 需先建 dataId，
      # 规则 JSON 见仓库 deploy/docker/sentinel/。adminLogin 无 degrade，故只配 flow）
      datasource:
        flow:
          nacos:
            server-addr: ${my.server.addr}:8848
            data-id: mall-sso-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
  jackson:
    default-property-inclusion: always
  datasource:
    admin:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_ams?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: root
      # jiaoxue：password: root；deploy password：tarena2017Up;
      password: root
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
    user:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_ums?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: root
      #jiaoxue：password: root；deploy password：tarena2017Up;
      password: root
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
    order:
      jdbc-url: jdbc:mysql://${my.server.addr}:3306/cs_mall_oms?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      username: root
      password: root
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
  #redis
  data:
    redis:
      host: ${my.server.addr}
      port: 6379
      password:

logging:
  level:
    com.cooxiao.mall: trace