my:
  server:
    addr: localhost

spring:
  config:
    import: optional:file:./.env[.properties]
  cloud:
    nacos:
      discovery:
        server-addr: http://${my.server.addr}:8848
    sentinel:
      transport:
        port: 8876
        dashboard: 127.0.0.1:8090
      eager: true
  elasticsearch:
    uris: http://${my.server.addr}:9200
  data:
    redis:
      host: ${my.server.addr}
      port: 6379
      password:

dubbo:
  application:
    name: mall-ai-dubbo
  protocol:
    port: -1
    name: dubbo
  registry:
    address: nacos://${my.server.addr}:8848
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false

custom:
  file-upload:
    resource-host: http://localhost:9060/

cooxiao:
  ai:
    # 本地开发用 API Key：兼容 AI_API_KEY（.env/IDE 注入）与 DEEPSEEK_API_KEY（本机用户级环境变量）。
    # 嵌套占位符：AI_API_KEY 优先，其次 DEEPSEEK_API_KEY，都缺才回退占位符。
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:sk-placeholder}}
    # 向量检索（硅基流动 BGE-M3，免费）
    embedding-enabled: true
    embedding-api-key: sk-pffsuuahmchjczrsmyltgaflkqyaeymcgwtsyrxoswvrnllw
    # 开发阶段放行 sync 接口（Swagger 可直调）
    sync-whitelisted: true

logging:
  level:
    com.cooxiao.mall: trace
