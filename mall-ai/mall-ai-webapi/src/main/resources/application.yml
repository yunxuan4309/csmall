server:
  port: 10010
spring:
  profiles:
    active: test
  mvc:
    async:
      request-timeout: 180000   # SSE 长连接超时 3 分钟
  application:
    name: mall-ai

seata:
  enabled: false

cooxiao:
  ai:
    # API Key 兼容两个环境变量名：生产 .env 用 AI_API_KEY；本地系统/用户变量用 DEEPSEEK_API_KEY。
    # 嵌套占位符：AI_API_KEY 优先，其次 DEEPSEEK_API_KEY，都缺才回退占位符（启动即暴露配置问题）。
    # ⚠️ Spring Boot 不自动读取 .env 文件——本地开发请在 IDE Run Configuration 注入环境变量，
    #    或用系统/用户环境变量（本机用户级已有 DEEPSEEK_API_KEY）。踩坑记录见 TODO 第二批 §5.4.5。
    api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:sk-placeholder}}
    base-url: ${AI_API_BASE_URL:https://api.deepseek.com}
    # ⚠️ chat-model 用 deepseek-chat（非推理模型）：重排/意图提取等 JSON 结构化任务需要"快+稳+不截断"，
    # 推理模型(deepseek-v4-flash)会思考到预算耗尽才输出，content 易被截断/挤空（2026-09-08 实测）。
    # 真正需要深度推理的 SSE 对话在 ChatServiceImpl 硬编码 v4-flash，不受此配置影响。
    chat-model: deepseek-chat
    compare-model: deepseek-v4-flash
    temperature: 0.7
    # max-tokens：deepseek-v4-flash 是 reasoning 模型，提示词禁思考后仍会产出大量 reasoning
    # （实测随 max_tokens 水涨船高：1000→想满1000、2000→想~1630）。max_tokens 必须 >> reasoning
    # 自然上限 + content 长度，否则 reasoning 占满 → content 空（重排偶发降级）。
    # 实测 2000 时 reasoning≈1630 content 正常(3/3成功)，但余量偏紧；3000 留足安全边际（2026-09-08 实测调优）
    max-tokens: 3000
    # LLM HTTP 调用超时：deepseek-v4-flash 是 reasoning 模型（先思考后回答），
    # 意图提取/AI 重排等完整生成常需 15-30s，15s 会导致 AI 重排 Read timed out 频繁降级
    timeout: 60000
    # Embedding 向量检索（硅基流动 BGE-M3，免费）
    embedding-enabled: false
    embedding-api-key: ${EMBEDDING_API_KEY:sk-placeholder}
    embedding-base-url: https://api.siliconflow.cn
    embedding-model: BAAI/bge-m3
    embedding-dimensions: 1024
    embedding-price-per-million: 0.0
    # 每日预算 2 元
    daily-budget: 2.0
    chat-input-price-per-million: 1.0
    chat-output-price-per-million: 2.0
    # ===== 高并发防护（TODO #2+#34）=====
    # 并发闸门：同时进行的 LLM 调用上限（含 chat/chatWithModel/embed + SSE 流式）
    concurrent-max: 20
    # 闸门满时不等待直接失败（慢请求等待无意义，降级更优）
    concurrent-wait-ms: 0
    # 每用户频控：60s 窗口最大请求数（防单用户刷爆预算/打满闸门）
    user-rate-limit-enabled: true
    user-rate-limit: 10

knife4j:
  enable: true
  production: false
  basic:
    enable: false
    username: root
    password: root

jwt:
  # JWT存储的请求头
  tokenHeader: Authorization
  # JWT加解密使用的密钥(HS512要求>=64字节)
  secret: ${JWT_SECRET:CooxiaoMall2026JwtSecretKeyForHs512AlgorithmMustBeAtLeast64BytesLong}
  # JWT的超期限时间(60*60*24)
  expiration: 604800
  tokenHead: Bearer


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# Actuator 健康检查（Docker 容器存活探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
